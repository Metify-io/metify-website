<svg width="100%" viewBox="0 0 680 424" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',sans-serif">
<title>The MOJO operational layer</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="30" text-anchor="start" dominant-baseline="central" font-size="18" font-weight="700" fill="#111827">The Operational Layer That Replaces VMware — for Bare Metal</text>
<rect x="40" y="52" width="600" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="58" y="72" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="700" fill="#085041">AI AGENTS</text>
<text x="58" y="88" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#0F6E56">Specialist agents that observe, reason, and act</text>
<rect x="58" y="96" width="100" height="20" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="108.0" y="106.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#085041">Orchestrator</text>
<rect x="166" y="96" width="76" height="20" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="204.0" y="106.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#085041">Health</text>
<rect x="250" y="96" width="90" height="20" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="295.0" y="106.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#085041">Compliance</text>
<rect x="348" y="96" width="96" height="20" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="396.0" y="106.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#085041">Provisioning</text>
<rect x="452" y="96" width="82" height="20" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="493.0" y="106.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#085041">Capacity</text>
<line x1="340.0" y1="122" x2="340.0" y2="140" stroke="#9AA0A6" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="40" y="144" width="600" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="58" y="164" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="700" fill="#6B3F08">GOVERNANCE</text>
<text x="58" y="182" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#854F0B">Every action is approved by a named human and written to an immutable audit trail</text>
<line x1="340.0" y1="196" x2="340.0" y2="214" stroke="#9AA0A6" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="40" y="218" width="600" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="58" y="238" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="700" fill="#0C447C">CONTROL PLANE — THE SYSTEM OF RECORD</text>
<text x="58" y="256" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#185FA5">Discovery, inventory, health telemetry, provisioning, native DDI</text>
<line x1="340.0" y1="270" x2="340.0" y2="288" stroke="#9AA0A6" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="40" y="292" width="600" height="64" rx="8" fill="#1F2A37" stroke="#0F172A" stroke-width="0.5"/>
<text x="58" y="312" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="700" fill="#E5E7EB">BARE METAL — ANY VENDOR</text>
<rect x="58" y="324" width="210" height="22" rx="11" fill="#33415580" stroke="#475569" stroke-width="0.5"/>
<text x="163.0" y="335" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="600" fill="#E5E7EB">Dell · HPE · Lenovo · Supermicro</text>
<rect x="276" y="324" width="214" height="22" rx="11" fill="#33415580" stroke="#475569" stroke-width="0.5"/>
<text x="383.0" y="335" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="600" fill="#E5E7EB">KubeVirt / OpenShift Virtualization</text>
<rect x="498" y="324" width="150" height="22" rx="11" fill="#33415580" stroke="#475569" stroke-width="0.5"/>
<text x="573.0" y="335" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="600" fill="#E5E7EB">RHEL / Linux workloads</text>
<text x="40" y="380" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#5F5E5A">Not a dashboard and not a CLI. A layered platform where agents do the work, governance keeps</text>
<text x="40" y="396" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#5F5E5A">humans in control, and the control plane holds the truth — across every vendor in the rack.</text>
<image x="584" y="394" width="20.2" height="24" href="data:image/png;base64," opacity="0.95"/>
<text x="611.2" y="411" font-size="10" font-weight="700" fill="#5F5E5A" letter-spacing="1.5">METIFY</text>
</svg>
