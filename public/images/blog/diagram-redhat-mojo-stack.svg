<text x="58" y="378" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#9CA3AF">Dell · HPE · Lenovo · Supermicro · Cisco · NVIDIA — one normalized fleet</text>
<rect x="572" y="340" width="68" height="52" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="0.5"/>
<text x="606.0" y="359" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" fill="#5F5E5A">THE</text>
<text x="606.0" y="373" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" fill="#5F5E5A">METAL</text>
<text x="40" y="418" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#5F5E5A">Red Hat builds the OS, the container platform, the virtualization layer. MOJO is the layer that</text>
<text x="40" y="434" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#5F5E5A">makes them land cleanly on hardware — and stays the canonical record of what runs underneath.</text>
