<rect x="98.0" y="281.0" width="134" height="42" rx="8" fill="#F4F4F5" stroke="#D4D4D8" stroke-width="0.5"/>
<text x="165" y="295" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="700" fill="#1F2A37">Intel</text>
<text x="165" y="311" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#5F5E5A">vPro / AMT</text>
<rect x="448.0" y="281.0" width="134" height="42" rx="8" fill="#F4F4F5" stroke="#D4D4D8" stroke-width="0.5"/>
<text x="515" y="295" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="700" fill="#1F2A37">NVIDIA</text>
<text x="515" y="311" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#5F5E5A">Redfish</text>
<text x="40" y="352" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#5F5E5A">Every BMC vendor implements Redfish differently, and firmware revisions add still more drift.</text>
<text x="40" y="368" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#5F5E5A">MOJO absorbs that variance so everything above it sees one inventory, one API, one audit log.</text>
<image x="584" y="36" width="20.2" height="24" href="data:image/png;base64," opacity="0.95"/>
<text x="611.2" y="53" font-size="10" font-weight="700" fill="#5F5E5A" letter-spacing="1.5">METIFY</text>
