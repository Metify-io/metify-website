<text x="120" y="199" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="700" fill="#1F2A37">Supermicro</text>
<text x="120" y="215" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#5F5E5A">IPMI</text>
