<line x1="340" y1="206" x2="560" y2="206" stroke="#CBD0D6" stroke-width="1.5"/>
<line x1="340" y1="206" x2="165" y2="302" stroke="#CBD0D6" stroke-width="1.5"/>
<line x1="340" y1="206" x2="515" y2="302" stroke="#CBD0D6" stroke-width="1.5"/>
