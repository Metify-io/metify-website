<svg width="100%" viewBox="0 0 680 360" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',sans-serif">
<title>The blast radius of one stolen operator credential under MOJO</title>
<defs>
<marker id="arrowC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="40" y="138" width="150" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="115" y="158" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#791F1F">Stolen credential</text>
<text x="115" y="176" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">the #1 breach vector</text>
<line x1="190" y1="166" x2="222" y2="166" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrowC)"/>
<rect x="226" y="40" width="240" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="346" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">Stopped at 2FA</text>
<text x="346" y="76" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">no enrolled device, no entry</text>
<rect x="226" y="96" width="240" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="346" y="114" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">Constrained by RBAC</text>
<text x="346" y="132" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">only what that role permits</text>
<rect x="226" y="152" width="240" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="346" y="170" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">Contained by pool isolation</text>
<text x="346" y="188" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">one group’s servers, not the fleet</text>
<rect x="226" y="208" width="240" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="346" y="226" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">Gated by approvals</text>
<text x="346" y="244" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">destructive acts need a second human</text>
<rect x="226" y="264" width="240" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="346" y="282" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">Monitored by audit</text>
<text x="346" y="300" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">every action captured, immutable</text>
<rect x="226" y="320" width="240" height="36" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="346" y="338" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">Quarantined across sites</text>
<line x1="466" y1="166" x2="488" y2="166" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrowC)"/>
<rect x="492" y="120" width="158" height="92" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="571" y="150" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Blast radius:</text>
<text x="571" y="168" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">a contained slice</text>
<text x="571" y="190" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">not the fleet —</text>
<text x="571" y="204" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">by architecture</text>
</svg>
