<svg width="100%" viewBox="0 0 680 470" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',sans-serif">
<title>BMC network exposure — conventional model versus MOJO model</title>
<defs>
<marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="170" y="34" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Conventional model</text>
<text x="170" y="52" text-anchor="middle" font-size="12" fill="#5F5E5A">Every BMC reachable from every workstation</text>
<rect x="95" y="74" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="170" y="96" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Operator workstations</text>
<rect x="50" y="190" width="78" height="40" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="89" y="210" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#791F1F">BMC</text>
<rect x="138" y="190" width="78" height="40" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="177" y="210" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#791F1F">BMC</text>
<rect x="50" y="250" width="78" height="40" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="89" y="270" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#791F1F">BMC</text>
<rect x="138" y="250" width="78" height="40" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="177" y="270" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#791F1F">BMC ×1000s</text>
<line x1="150" y1="118" x2="89" y2="188" stroke="#A32D2D" stroke-width="0.8"/>
<line x1="165" y1="118" x2="177" y2="188" stroke="#A32D2D" stroke-width="0.8"/>
<line x1="178" y1="118" x2="89" y2="248" stroke="#A32D2D" stroke-width="0.8"/>
<line x1="192" y1="118" x2="177" y2="248" stroke="#A32D2D" stroke-width="0.8"/>
<rect x="50" y="312" width="240" height="48" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="170" y="330" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#791F1F">Hundreds to thousands of management</text>
<text x="170" y="348" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#791F1F">interfaces exposed on the network</text>
<line x1="318" y1="60" x2="318" y2="420" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="500" y="34" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">MOJO model</text>
<text x="500" y="52" text-anchor="middle" font-size="12" fill="#5F5E5A">One path in — the BMC network is isolated</text>
<rect x="425" y="74" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="500" y="96" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Operator workstations</text>
<line x1="500" y1="118" x2="500" y2="148" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrowB)"/>
<text x="572" y="135" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">single TLS path</text>
<rect x="410" y="150" width="180" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="500" y="168" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">MOJO reverse proxy</text>
<text x="500" y="186" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">TLS termination, per-session</text>
<rect x="360" y="226" width="280" height="134" rx="12" fill="none" stroke="#0F6E56" stroke-width="0.5" stroke-dasharray="5 4"/>
<text x="500" y="244" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">Isolated BMC network — no routable exposure</text>
<rect x="406" y="262" width="84" height="38" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="448" y="281" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">BMC</text>
<rect x="510" y="262" width="84" height="38" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="552" y="281" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">BMC</text>
<rect x="458" y="312" width="84" height="38" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="500" y="331" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">BMC</text>
<line x1="500" y1="200" x2="465" y2="260" stroke="#0F6E56" stroke-width="0.8"/>
<line x1="500" y1="200" x2="540" y2="260" stroke="#0F6E56" stroke-width="0.8"/>
<line x1="500" y1="200" x2="500" y2="310" stroke="#0F6E56" stroke-width="0.8"/>
<rect x="360" y="378" width="280" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="500" y="396" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">Zero management interfaces need</text>
<text x="500" y="412" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">network exposure</text>
</svg>
