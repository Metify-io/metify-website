<svg width="100%" viewBox="0 0 680 480" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',sans-serif">
<title>MOJO's six security layers</title>
<defs>
<marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="40" y="40" width="180" height="34" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="130" y="61" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#791F1F">External threat</text>
<line x1="220" y1="57" x2="276" y2="57" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrowA)"/>
<rect x="280" y="40" width="360" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="460" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Layer 1 — Perimeter</text>
<text x="460" y="76" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">Single binary · TLS · BMC isolation · air-gap-first</text>
<rect x="280" y="106" width="360" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="460" y="124" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Layer 2 — Identity</text>
<text x="460" y="142" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">LDAP / AD sync · TOTP 2FA · signed sessions</text>
<rect x="280" y="172" width="360" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="460" y="190" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Layer 3 — Authorization</text>
<text x="460" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">Fine-grained RBAC · pool isolation · approval gates</text>
<rect x="280" y="238" width="360" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="460" y="256" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Layer 4 — Audit</text>
<text x="460" y="274" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">Immutable change history · credential chain of custody</text>
<rect x="280" y="304" width="360" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="460" y="322" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Layer 5 — Federation</text>
<text x="460" y="340" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">Mutual TLS · encrypted tokens · site autonomy first</text>
<rect x="280" y="370" width="360" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="460" y="388" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Layer 6 — NIST 800-53 alignment</text>
<text x="460" y="406" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">AC · AU · IA · SC · CM enforced architecturally</text>
<line x1="280" y1="90" x2="280" y2="370" stroke="#185FA5" stroke-width="0.5" stroke-dasharray="3 3"/>
<rect x="40" y="370" width="180" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="130" y="388" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Protected fleet</text>
<text x="130" y="406" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Six walls, not one</text>
<line x1="280" y1="395" x2="224" y2="395" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrowA)"/>
<text x="130" y="180" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">An attacker does</text>
<text x="130" y="198" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">not face one wall.</text>
<text x="130" y="222" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">They face six —</text>
<text x="130" y="240" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">each one</text>
<text x="130" y="258" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">independently</text>
<text x="130" y="276" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">enforced.</text>
</svg>
