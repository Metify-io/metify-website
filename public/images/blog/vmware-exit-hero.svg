<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1f2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c3f73a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8bc34a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#991b1b;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c3f73a;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Grid pattern -->
  <g opacity="0.06">
    <line x1="0" y1="0" x2="0" y2="630" stroke="#c3f73a" stroke-width="1" />
    <line x1="60" y1="0" x2="60" y2="630" stroke="#c3f73a" stroke-width="1" />
    <line x1="120" y1="0" x2="120" y2="630" stroke="#c3f73a" stroke-width="1" />
    <line x1="180" y1="0" x2="180" y2="630" stroke="#c3f73a" stroke-width="1" />
    <line x1="240" y1="0" x2="240" y2="630" stroke="#c3f73a" stroke-width="1" />
    <line x1="300" y1="0" x2="300" y2="630" stroke="#c3f73a" stroke-width="1" />
    <line x1="360" y1="0" x2="360" y2="630" stroke="#c3f73a" stroke-width="1" />
    <line x1="420" y1="0" x2="420" y2="630" stroke="#c3f73a" stroke-width="1" />
    <line x1="480" y1="0" x2="480" y2="630" stroke="#c3f73a" stroke-width="1" />
    <line x1="540" y1="0" x2="540" y2="630" stroke="#c3f73a" stroke-width="1" />
    <line x1="600" y1="0" x2="600" y2="630" stroke="#c3f73a" stroke-width="1" />
    <line x1="660" y1="0" x2="660" y2="630" stroke="#c3f73a" stroke-width="1" />
    <line x1="720" y1="0" x2="720" y2="630" stroke="#c3f73a" stroke-width="1" />
    <line x1="780" y1="0" x2="780" y2="630" stroke="#c3f73a" stroke-width="1" />
    <line x1="840" y1="0" x2="840" y2="630" stroke="#c3f73a" stroke-width="1" />
    <line x1="900" y1="0" x2="900" y2="630" stroke="#c3f73a" stroke-width="1" />
    <line x1="960" y1="0" x2="960" y2="630" stroke="#c3f73a" stroke-width="1" />
    <line x1="1020" y1="0" x2="1020" y2="630" stroke="#c3f73a" stroke-width="1" />
    <line x1="1080" y1="0" x2="1080" y2="630" stroke="#c3f73a" stroke-width="1" />
    <line x1="1140" y1="0" x2="1140" y2="630" stroke="#c3f73a" stroke-width="1" />
    <line x1="1200" y1="0" x2="1200" y2="630" stroke="#c3f73a" stroke-width="1" />
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#c3f73a" stroke-width="1" />
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#c3f73a" stroke-width="1" />
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#c3f73a" stroke-width="1" />
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#c3f73a" stroke-width="1" />
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#c3f73a" stroke-width="1" />
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#c3f73a" stroke-width="1" />
    <line x1="0" y1="360" x2="1200" y2="360" stroke="#c3f73a" stroke-width="1" />
    <line x1="0" y1="420" x2="1200" y2="420" stroke="#c3f73a" stroke-width="1" />
    <line x1="0" y1="480" x2="1200" y2="480" stroke="#c3f73a" stroke-width="1" />
    <line x1="0" y1="540" x2="1200" y2="540" stroke="#c3f73a" stroke-width="1" />
    <line x1="0" y1="600" x2="1200" y2="600" stroke="#c3f73a" stroke-width="1" />
  </g>

  <!-- Red glow (left - VMware exodus) -->
  <circle cx="250" cy="315" r="220" fill="url(#redGlow)" />

  <!-- Green glow (right - MOJO) -->
  <circle cx="950" cy="315" r="220" fill="url(#greenGlow)" />

  <!-- Server rack icons (left side - red/declining) -->
  <g transform="translate(140, 180)" opacity="0.5">
    <!-- Server 1 -->
    <rect x="0" y="0" width="80" height="22" rx="3" fill="none" stroke="#dc2626" stroke-width="1.5" opacity="0.6" />
    <circle cx="12" cy="11" r="3" fill="#dc2626" opacity="0.8" />
    <line x1="25" y1="8" x2="65" y2="8" stroke="#dc2626" stroke-width="1" opacity="0.4" />
    <line x1="25" y1="14" x2="55" y2="14" stroke="#dc2626" stroke-width="1" opacity="0.4" />
    <!-- Server 2 -->
    <rect x="0" y="28" width="80" height="22" rx="3" fill="none" stroke="#dc2626" stroke-width="1.5" opacity="0.5" />
    <circle cx="12" cy="39" r="3" fill="#dc2626" opacity="0.6" />
    <line x1="25" y1="36" x2="65" y2="36" stroke="#dc2626" stroke-width="1" opacity="0.3" />
    <line x1="25" y1="42" x2="55" y2="42" stroke="#dc2626" stroke-width="1" opacity="0.3" />
    <!-- Server 3 -->
    <rect x="0" y="56" width="80" height="22" rx="3" fill="none" stroke="#dc2626" stroke-width="1.5" opacity="0.4" />
    <circle cx="12" cy="67" r="3" fill="#dc2626" opacity="0.4" />
    <!-- X mark -->
    <line x1="30" y1="100" x2="50" y2="120" stroke="#dc2626" stroke-width="3" opacity="0.6" />
    <line x1="50" y1="100" x2="30" y2="120" stroke="#dc2626" stroke-width="3" opacity="0.6" />
  </g>

  <!-- Arrow from left to right -->
  <g filter="url(#glow)">
    <line x1="420" y1="315" x2="750" y2="315" stroke="url(#accent)" stroke-width="2" stroke-dasharray="8,6" opacity="0.6" />
    <polygon points="755,308 770,315 755,322" fill="#c3f73a" opacity="0.8" />
  </g>

  <!-- Server rack icons (right side - green/thriving) -->
  <g transform="translate(860, 180)" opacity="0.7">
    <!-- Server 1 -->
    <rect x="0" y="0" width="80" height="22" rx="3" fill="none" stroke="#c3f73a" stroke-width="1.5" />
    <circle cx="12" cy="11" r="3" fill="#c3f73a" />
    <line x1="25" y1="8" x2="65" y2="8" stroke="#c3f73a" stroke-width="1" opacity="0.6" />
    <line x1="25" y1="14" x2="55" y2="14" stroke="#c3f73a" stroke-width="1" opacity="0.6" />
    <!-- Server 2 -->
    <rect x="0" y="28" width="80" height="22" rx="3" fill="none" stroke="#c3f73a" stroke-width="1.5" />
    <circle cx="12" cy="39" r="3" fill="#c3f73a" />
    <line x1="25" y1="36" x2="65" y2="36" stroke="#c3f73a" stroke-width="1" opacity="0.6" />
    <line x1="25" y1="42" x2="55" y2="42" stroke="#c3f73a" stroke-width="1" opacity="0.6" />
    <!-- Server 3 -->
    <rect x="0" y="56" width="80" height="22" rx="3" fill="none" stroke="#c3f73a" stroke-width="1.5" />
    <circle cx="12" cy="67" r="3" fill="#c3f73a" />
    <line x1="25" y1="64" x2="65" y2="64" stroke="#c3f73a" stroke-width="1" opacity="0.6" />
    <line x1="25" y1="70" x2="55" y2="70" stroke="#c3f73a" stroke-width="1" opacity="0.6" />
    <!-- AI brain icon -->
    <circle cx="40" cy="110" r="18" fill="none" stroke="#c3f73a" stroke-width="1.5" />
    <path d="M30,105 Q35,95 40,105 Q45,95 50,105" fill="none" stroke="#c3f73a" stroke-width="1.2" />
    <path d="M30,112 Q35,118 40,112 Q45,118 50,112" fill="none" stroke="#c3f73a" stroke-width="1.2" />
    <circle cx="36" cy="108" r="2" fill="#c3f73a" />
    <circle cx="44" cy="108" r="2" fill="#c3f73a" />
  </g>

  <!-- Stat callouts -->
  <g>
    <text x="160" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#dc2626" opacity="0.8">1,050%</text>
    <text x="160" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">price increases reported</text>
  </g>

  <g>
    <text x="860" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#c3f73a" opacity="0.9">AI-Native</text>
    <text x="860" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">infrastructure platform</text>
  </g>

  <!-- Title text -->
  <text x="600" y="520" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#f8fafc" letter-spacing="-0.02em">The VMware Exit Is Real</text>
  <text x="600" y="560" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#94a3b8">And the Next Platform Isn't Another Hypervisor</text>

  <!-- Metify brand bar at bottom -->
  <rect x="0" y="610" width="1200" height="20" fill="#c3f73a" opacity="0.9" />
  <text x="600" y="624" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0a0f1a" letter-spacing="0.15em">METIFY.IO</text>
</svg>